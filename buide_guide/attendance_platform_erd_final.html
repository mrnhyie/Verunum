<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
#erd svg.erDiagram text { fill: #000 !important; }
#erd svg.erDiagram .er.relationshipLabel { fill: #000 !important; }
#erd svg.erDiagram .er.relationshipLine { stroke: #555 !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: false,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: '#555555',
    textColor: '#000000',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  ORGANIZATIONS ||--o{ BRANCHES : has
  ORGANIZATIONS ||--o{ USERS : has
  ORGANIZATIONS ||--o{ DEVICES : has
  ORGANIZATIONS ||--o{ ATTENDANCE_RULES : configures
  BRANCHES ||--o{ USERS : contains
  BRANCHES ||--o{ DEVICES : hosts
  USERS ||--o{ ATTENDANCE_EVENTS : generates
  DEVICES ||--o{ ATTENDANCE_EVENTS : records
  USERS ||--o| RFID_CARDS : has
  USERS ||--o{ AUDIT_LOGS : triggers
  ORGANIZATIONS ||--o{ SMS_LOGS : sends
  USERS ||--o{ DEVICE_ENROLLMENTS : enrolled_via
  DEVICES ||--o{ DEVICE_ENROLLMENTS : stores
  DEVICES ||--o{ DEVICE_COMMANDS : queued_for

  ORGANIZATIONS {
    int id PK
    string name
    string type
    text settings_json
  }
  BRANCHES {
    int id PK
    int organization_id FK
    string name
    string location
  }
  USERS {
    int id PK
    int organization_id FK
    int branch_id FK
    string full_name
    string phone
    string role
    string status
    string fingerprint_status
  }
  DEVICES {
    int id PK
    int organization_id FK
    int branch_id FK
    string name
    string status
    datetime last_heartbeat
  }
  DEVICE_ENROLLMENTS {
    int id PK
    int user_id FK
    int device_id FK
    int slot_id
    string status
    datetime enrolled_at
  }
  DEVICE_COMMANDS {
    int id PK
    int device_id FK
    string command_type
    text payload_json
    string status
    datetime created_at
  }
  ATTENDANCE_EVENTS {
    int id PK
    int user_id FK
    int device_id FK
    string event_type
    datetime timestamp
    string verification_method
    string sync_status
  }
  RFID_CARDS {
    int id PK
    int user_id FK
    string uid
    string status
    date issue_date
    date expiry_date
    string personalization_status
  }
  ATTENDANCE_RULES {
    int id PK
    int organization_id FK
    string working_hours
    string late_threshold
  }
  SMS_LOGS {
    int id PK
    int organization_id FK
    string recipient_phone
    string status
  }
  AUDIT_LOGS {
    int id PK
    int user_id FK
    string action
    datetime timestamp
  }
`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
