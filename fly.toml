# fly.toml app configuration file generated for verunum on 2026-09-30T07:52:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'verunum'
primary_region = 'cdg'

[build]

[env]
  DB_PATH = '/data/verunum.db'
  GIN_MODE = 'release'
  PORT = '8080'

[[mounts]]
  source = 'verunum_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
