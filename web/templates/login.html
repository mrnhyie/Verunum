<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/static/app.css?v=20260930b">
  <title>Sign in · Verunum</title>
</head>
<body class="login mono-theme">
  <main class="mono-card" style="padding: 40px">
    <div class="auth-brand" style="justify-content: center; margin-bottom: 24px">
      <img class="brand-logo" src="/static/logo.svg" alt="Verunum">
      <strong style="color: var(--ink); font-size: 20px">verunum</strong>
    </div>

    <h1 style="text-align: center; margin: 0 0 6px">Sign in</h1>
    <p style="color: var(--muted); text-align: center; margin: 0 0 24px; font-size: 13px">Enter your credentials to access your workspace.</p>

    <form method="post" action="/auth/login">
      <label style="color: var(--ink); font-weight: 600; font-size: 13px">
        Email address
        <input name="email" type="email" required autocomplete="email" placeholder="you@company.com" style="border-radius: 10px; border-color: var(--border-light)">
      </label>

      <label style="color: var(--ink); font-weight: 600; font-size: 13px; margin-top: 12px">
        Password
        <input name="password" type="password" required autocomplete="current-password" placeholder="••••••••" style="border-radius: 10px; border-color: var(--border-light)">
      </label>

      <button type="submit" class="btn-pill btn-pill-primary" style="width: 100%; margin-top: 20px; padding: 12px">
        Sign in to Verunum
      </button>

      {{if .Error}}
      <div class="alert-banner error" style="margin-top: 16px; font-size: 12px">
        {{.Error}}
      </div>
      {{end}}
    </form>
  </main>
</body>
</html>
