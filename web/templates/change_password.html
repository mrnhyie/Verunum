<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Set password · Verunum</title>
  <link rel="stylesheet" href="/static/app.css?v=20260918">
</head>
<body class="login">
  <aside class="sidebar">
    <p class="rail-label">Workspace</p>
    <a class="rail-link" href="/dashboard"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Dashboard</a>
    <p class="rail-label">Management</p>
    <a class="rail-link" href="/users"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>People</a>
    <a class="rail-link" href="/devices"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 17h6"/></svg>Devices</a>
    <a class="rail-link" href="/rfid-cards"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>RFID cards</a>
    <p class="rail-label">Operations</p>
    <a class="rail-link" href="/attendance"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>Attendance</a>
    <a class="rail-link" href="/reports/daily"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7M3 20h18"/></svg>Reports</a>
  </aside>

  <main class="mono-card" style="border-radius: 20px; padding: 40px;">
    <div class="auth-brand" style="justify-content: center; margin-bottom: 24px;">
      <span class="brand-mark">V</span>
      <strong style="font-size: 20px;">verunum</strong>
    </div>

    <h1 style="font-size: 24px; font-weight: 800; text-align: center; margin: 0 0 6px;">Set your password</h1>
    <p style="color: var(--muted); text-align: center; margin: 0 0 24px; font-size: 13px;">
      Your account was provisioned by Verunum staff. Choose a private password to continue to your organisation workspace.
    </p>

    <form method="post" action="/account/password">
      <label>New password
        <input name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="Minimum 8 characters" style="border-radius: 10px;">
      </label>
      <label>Confirm new password
        <input name="confirm_password" type="password" minlength="8" required autocomplete="new-password" placeholder="Re-enter your password" style="border-radius: 10px;">
      </label>
      <button type="submit" class="btn-pill btn-pill-primary" style="width: 100%; margin-top: 12px; padding: 12px;">Save password and continue</button>
      {{if .Error}}<div class="alert-banner error" style="margin-top: 16px; font-size: 12px;">{{.Error}}</div>{{end}}
    </form>
  </main>
</body>
</html>
