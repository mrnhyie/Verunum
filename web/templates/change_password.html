<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Set password · Verunum</title>
  <link rel="stylesheet" href="/static/app.css?v=20260928b">
</head>
<body class="login">
    <main class="mono-card" style="padding: 40px">
    <div class="auth-brand" style="justify-content: center; margin-bottom: 24px">
      <img class="brand-logo" src="/static/logo.svg" alt="Verunum">
      <strong style="font-size: 20px">verunum</strong>
    </div>

    <h1 style="text-align: center; margin: 0 0 6px">Set your password</h1>
    <p style="color: var(--muted); text-align: center; margin: 0 0 24px; font-size: 13px">
      Your account was provisioned by Verunum staff. Choose a private password to continue to your organisation workspace.
    </p>

    <form method="post" action="/account/password">
      <label>New password
        <input name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="Minimum 8 characters" style="border-radius: 10px">
      </label>
      <label>Confirm new password
        <input name="confirm_password" type="password" minlength="8" required autocomplete="new-password" placeholder="Re-enter your password" style="border-radius: 10px">
      </label>
      <button type="submit" class="btn-pill btn-pill-primary" style="width: 100%; margin-top: 12px; padding: 12px">Save password and continue</button>
      {{if .Error}}<div class="alert-banner error" style="margin-top: 16px; font-size: 12px">{{.Error}}</div>{{end}}
    </form>
  </main>
</body>
</html>
