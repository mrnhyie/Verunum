<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register device · Verunum</title>
  <link rel="stylesheet" href="/static/app.css?v=20261001a">
</head>
<body class="app-shell">
  <header class="topbar">
    <a class="brand" href="/dashboard">
      <img class="brand-logo" src="/static/logo.svg" alt="Verunum">
      <span>verunum</span>
    </a>
    <span class="breadcrumb">/ Devices / Register</span>
    <div class="topbar-actions">
      <span class="avatar">DA</span>
      <form class="logout-form" action="/auth/logout" method="post">
        <button type="submit" title="Log out">
          <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M21 19V5a2 2 0 0 0-2-2h-6"/></svg>
        </button>
      </form>
    </div>
  </header>

  <aside class="sidebar">
    <p class="rail-label">Workspace</p>
    <a class="rail-link" href="/dashboard"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Dashboard</a>
    <p class="rail-label">Management</p>
    <a class="rail-link" href="/users"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>People</a>
    <a class="rail-link" href="/devices"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 17h6"/></svg>Devices</a>
    <a class="rail-link" href="/rfid-cards"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>RFID cards</a>
    <a class="rail-link" href="/roles"><svg viewBox="0 0 24 24"><path d="M20.6 13.4 12 22l-9-9V4h9l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Roles</a>
    <a class="rail-link" href="/groups"><svg viewBox="0 0 24 24"><path d="m12 2 9 5-9 5-9-5z"/><path d="m3 12 9 5 9-5"/></svg>Groups</a>
    <p class="rail-label">Operations</p>
    <a class="rail-link" href="/attendance"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>Attendance</a>
    <a class="rail-link" href="/settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Work hours</a>
    <a class="rail-link" href="/reports/daily"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7M3 20h18"/></svg>Reports</a>
  </aside>

  <main class="form-main" style="padding-top: 40px">
    <a class="back-link" href="/devices">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to devices
    </a>

    <div class="form-heading">
      <p class="eyebrow">Management</p>
      <h1>Register device</h1>
      <p class="subtle">Add a terminal to your organisation and generate its API key.</p>
    </div>

    <form class="mono-card" method="post" action="/devices">
      <div class="form-section">
        <h2>Device details</h2>
        <div class="form-grid" style="gap: 18px">
          <label>Device name
            <input name="name" required placeholder="e.g. Main gate terminal">
          </label>
          <label>Serial number
            <input name="serial" required placeholder="e.g. ZK-001">
          </label>
        </div>
      </div>

      <div class="form-actions">
        <a href="/devices">Cancel</a>
        <button type="submit" class="btn-pill btn-pill-primary">Register device</button>
      </div>
    </form>
  </main>
</body>
</html>
